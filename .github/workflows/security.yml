# AI Study Assistant — 安全检查 workflow（v0.2.0 Security Gate P3）
# 与 test.yml（pytest + ruff）职责分离：
#   test.yml     -> 测试 + 代码风格
#   security.yml -> 敏感信息（Secret）扫描
#
# gitleaks 扫描完整 Git 历史（fetch-depth: 0），使用 .gitleaks.toml，
# 检测到泄露即以非零退出码使 workflow 失败，阻断合并/发布。

name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks

      - name: Scan full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --exit-code 1
