# 模型配置模板
# 使用方法：复制本文件为 config.yaml，按需修改。
#
# 设计目标：切换厂商只改这个文件（或 .env），不改任何代码。
# ${VAR} 表示从环境变量（.env）读取。

provider: openai              # 当前使用的厂商 preset 名称

llm:
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}   # 也可直接填字符串，但推荐走 .env
  model: ${OPENAI_MODEL}
  temperature: 0.3

