[project]
name = "ai-study-assistant"
version = "0.1.0"
description = "本地运行的 AI 学习资料整理工具"
readme = "README.md"
license = "MIT"
authors = [
    { name = "uufy13", email = "zhoushurenapple@proton.me" },
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
ai-study-assistant = "ai_study_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_study_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
